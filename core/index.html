<!DOCTYPE html>
<!-- rubiks-cube web client — the real Roblox wasm join page, 1:1.
     DOM + CSS are verbatim from the captured play page; scripts wire the
     canonical /api model + WasmLoader (-> WasmPlayer) + driver. -->
<html lang="en"><head>
<meta charset="utf-8"><title>Roblox</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Builder Sans;src:url(/webclient/loading/BuilderSans-Regular.otf)}
@font-face{font-family:Builder Sans;font-weight:700;src:url(/webclient/loading/BuilderSans-Bold.otf)}
@font-face{font-family:Source Sans Pro;src:url(/webclient/loading/SourceSansPro-Regular.ttf)}
@font-face{font-family:Source Sans Pro;font-weight:600;src:url(/webclient/loading/SourceSansPro-Semibold.ttf)}
html,body{margin:0;height:100%;background:#272930}
.emscripten{display:block;margin-right:auto;margin-left:auto;padding-right:0}
textarea.emscripten{width:80%;font-family:monospace}
div.emscripten{text-align:center}
canvas.emscripten{border:0;background-color:black;cursor:none;touch-action:none}
#loading-overlay{position:fixed;z-index:10;inset:0;display:grid;overflow:hidden;place-items:center;isolation:isolate;background:#272930;color:#f7f7f8;font-family:Builder Sans,sans-serif;font-weight:400;opacity:1;transition:opacity .6s ease;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;--loading-icon-size:clamp(150px,14.65vmax,256px);--loading-background-width:max(150vw,177.78vh);--loading-pan-distance:calc((var(--loading-background-width) - 100vw) / 2);--loading-padding-top:24px;--loading-padding-right:24px;--loading-padding-bottom:24px;--loading-padding-left:24px}
#loading-overlay.loading-auth-pending>:not(.loading-background),#loading-overlay[hidden]{display:none}
#loading-overlay.loading-exiting{pointer-events:none;opacity:0}
.loading-background,.loading-dark-gradient{position:absolute;inset:0}
.loading-background{overflow:hidden;background:#272930}
#loading-background-image{position:absolute;top:50%;left:50%;width:var(--loading-background-width);max-width:none;height:auto;opacity:0;filter:blur(6px);transform:translate3d(-50%,-50%,0);transition:opacity .6s linear;will-change:transform,filter}
.loading-background.loading-image-ready #loading-background-image{opacity:1;animation:loading-background-pan 20s linear infinite}
.loading-dark-gradient{z-index:1;background:linear-gradient(180deg,rgb(0 0 0/0) 0,rgb(0 0 0/0) 50%,rgb(0 0 0/50%))}
.loading-info-card{position:relative;z-index:2;box-sizing:border-box;width:calc(60vw - 28.8px);padding:calc(var(--loading-icon-size) / 2 + 36px) 0 36px;border-radius:8px;grid-area:1/1;background:rgb(32 34 39/80%);text-align:center}
#loading-icon-shell{position:absolute;top:0;left:50%;width:var(--loading-icon-size);height:var(--loading-icon-size);overflow:hidden;border-radius:8px;background:#656668;transform:translate(-50%,-50%)}
#loading-icon-shell:after{position:absolute;inset:-60%;background:linear-gradient(115deg,rgb(255 255 255/0) 35%,rgb(255 255 255/42%) 50%,rgb(255 255 255/0) 65%);content:"";transform:translateX(-55%);animation:loading-icon-shimmer 2s linear infinite}
#loading-experience-icon{width:100%;height:100%;-o-object-fit:cover;object-fit:cover;opacity:0;transition:opacity .35s ease}
#loading-icon-shell.loading-image-ready #loading-experience-icon{opacity:1}
#loading-experience-title{width:80%;margin:0;margin-inline:auto;overflow:hidden;color:#f7f7f8;font-size:28.5714px;font-weight:700;line-height:36px;overflow-wrap:anywhere;text-overflow:ellipsis}
.loading-creator-line{display:flex;width:60%;margin:36px auto 0;align-items:center;justify-content:center;gap:6px;color:#d5d7dd;font-size:15.873px;line-height:20px}
#loading-verified-badge{display:inline-block;width:16px;height:16px;flex:0 0 16px;background:url(/webclient/loading/VerifiedBadgeNameIcon.png) 50%/contain no-repeat}
#loading-verified-badge[hidden]{display:none}
#status{position:absolute;z-index:3;right:calc(var(--loading-padding-right) + 24px);bottom:calc(var(--loading-padding-bottom) - 24px);left:calc(var(--loading-padding-left) + 24px);display:grid;height:48px;align-items:center;overflow:hidden;color:#bdbebe;font-size:9.5238px;font-weight:500;line-height:12px;text-align:center}
.loading-status-spinner{position:absolute;z-index:3;right:var(--loading-padding-right);bottom:var(--loading-padding-bottom);display:none;box-sizing:border-box;width:24px;height:24px;border:3px solid rgb(255 255 255/30%);border-top-color:#fff;border-radius:50%;animation:loading-spinner-rotation .9s linear infinite}
#loading-cancel{position:absolute;z-index:4;top:var(--loading-padding-top);left:var(--loading-padding-left);width:32px;height:32px;padding:0;border:0;visibility:hidden;background:transparent url(/webclient/loading/cancelButton.png) 50%/contain no-repeat;cursor:pointer;pointer-events:none;animation:loading-cancel-reveal 0s step-end 5s forwards}
#loading-cancel:hover{opacity:.8}
#loading-cancel:focus-visible{outline:2px solid white;outline-offset:2px}
.loading-error-panel{position:relative;z-index:5;display:none;box-sizing:border-box;width:clamp(320px,calc(100vw - 40px),400px);min-height:250px;max-height:calc(100vh - 100px);border:0;grid-area:1/1;grid-template-rows:50px 1px minmax(199px,auto);background:#393b3d;color:#bdbebe;font-family:Source Sans Pro,sans-serif;text-align:center;animation:loading-error-open .15s cubic-bezier(.83,0,.17,1)}
.loading-error-header{display:grid;box-sizing:border-box;height:50px;place-items:center}
#loading-error-title{margin:0;color:#fff;font-size:19.8886px;font-weight:600;line-height:28px}
.loading-error-divider{height:1px;margin:0 20px;background:#bdbebe}
.loading-error-body{display:grid;box-sizing:border-box;min-height:199px;padding:20px;grid-template-rows:minmax(83px,1fr) 36px;grid-gap:20px;gap:20px}
.loading-error-copy{display:flex;min-height:0;align-items:center;flex-direction:column;justify-content:center;overflow:auto;color:#bdbebe;font-size:15.9109px;font-weight:400;line-height:20px;overflow-wrap:anywhere}
#loading-error-code,#loading-error-message{margin:0}
#loading-error-leave{width:100%;height:36px;padding:0;border:0;border-radius:8px;background:#fff;color:#232527;cursor:pointer;font:400 15.9109px/36px Source Sans Pro,sans-serif}
#loading-error-leave:hover{background:#f2f2f2}
#loading-error-leave:focus-visible{outline:2px solid #00a2ff;outline-offset:2px}
#loading-overlay.loading-failed #status{display:none}
#loading-overlay.loading-failed .loading-error-panel:not([hidden]){display:grid}
#loading-overlay.loading-failed .loading-dark-gradient{z-index:4;background:rgb(0 0 0/70%)}
#loading-overlay.loading-failed .loading-status-spinner{display:none}
#loading-overlay.loading-failed #loading-cancel{display:none;animation:none}
#input-container{position:absolute;z-index:-100;top:0;left:-1000px;display:flex;border:none;outline:none;justify-content:flex-start}
#input-input,#input-textarea{display:none;margin:0;padding:0;border:none;outline:none;resize:none}
#input-textarea{max-height:100%;overflow:hidden;field-sizing:content}
.fullscreencanvas,.mobilecanvas{position:absolute;top:0;left:0;display:block;width:100%;height:100%;margin:0;overflow:hidden;border:0}
.emscripten_border{position:static}
@keyframes loading-error-open{0%{transform:scale(0)}}
@keyframes loading-icon-shimmer{0%{transform:translateX(-55%)}}
@keyframes loading-background-pan{0%,to{transform:translate3d(-50%,-50%,0)}25%{transform:translate3d(calc(-50% + var(--loading-pan-distance)),-50%,0)}75%{transform:translate3d(calc(-50% - var(--loading-pan-distance)),-50%,0)}}
@keyframes loading-cancel-reveal{to{visibility:visible;pointer-events:auto}}
@keyframes loading-spinner-rotation{to{transform:rotate(1turn)}}
@media (orientation:portrait){.loading-info-card{width:calc(100vw - var(--loading-padding-left) - var(--loading-padding-right))}}
@media (hover:none),(pointer:coarse){#loading-overlay{--loading-padding-top:44px;--loading-padding-bottom:44px}.loading-info-card{padding-top:calc(var(--loading-icon-size) / 2 + 12px);padding-bottom:12px}#loading-experience-title{font-size:15.873px;line-height:20px}.loading-creator-line{margin-top:12px}}
@media (hover:none) and (orientation:landscape),(pointer:coarse) and (orientation:landscape){#loading-overlay{--loading-padding-top:24px;--loading-padding-right:44px;--loading-padding-bottom:24px;--loading-padding-left:44px}.loading-info-card{width:calc(60vw - 52.8px)}}
@media (prefers-reduced-motion:reduce){#loading-overlay{transition-duration:0s}#loading-icon-shell:after{animation:none}#loading-background-image{transform:translate3d(-50%,-50%,0)}#loading-cancel,.loading-background.loading-image-ready #loading-background-image{animation:none}#loading-cancel{visibility:visible;pointer-events:auto}.loading-status-spinner{display:block}}
#loading-overlay.tab-lock-contended .loading-info-card,#loading-overlay.tab-lock-contended .loading-status-spinner{display:none}
#loading-overlay.tab-lock-contended #status{position:relative;inset:auto;z-index:5;display:block;grid-area:1/1;box-sizing:border-box;height:auto;max-width:min(460px,calc(100vw - 48px));margin:0 24px;overflow:visible;padding:18px 24px;border-radius:12px;background:#00a2ff;color:#fff;font-family:Builder Sans,sans-serif;font-size:18px;font-weight:500;line-height:1.35;text-align:center;box-shadow:0 8px 24px rgb(0 94 148/28%)}
canvas.tab-lock-contended{cursor:default}
/* rubiks-head marks — logo lives inside the loader (bottom-right, subtle) + hidden debug console */
#rlogo{position:absolute;right:20px;bottom:52px;width:88px;opacity:.22;z-index:4;pointer-events:none}
#dbg{display:none;position:fixed;left:0;bottom:0;max-width:52vw;max-height:34vh;overflow:auto;background:rgba(0,0,0,.72);padding:6px 9px;font:11px/1.4 monospace;white-space:pre-wrap;z-index:20;border-top:1px solid #26282a;color:#cfd8dc}
</style>
</head><body>

<div id="input-container">
  <textarea id="input-textarea" autocapitalize="off"></textarea>
  <input id="input-input" autocapitalize="off">
</div>

<div class="emscripten_border">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="loading-overlay" role="dialog" aria-label="Loading Roblox" aria-busy="true">
    <div class="loading-background" aria-hidden="true"><img id="loading-background-image" alt="" crossorigin="anonymous"></div>
    <div class="loading-dark-gradient" aria-hidden="true"></div>
    <section class="loading-info-card" aria-labelledby="loading-experience-title">
      <div id="loading-icon-shell" aria-hidden="true"><img id="loading-experience-icon" alt="" crossorigin="anonymous"></div>
      <h1 id="loading-experience-title">Joining experience</h1>
      <div class="loading-creator-line">
        <span id="loading-experience-creator" hidden></span>
        <span id="loading-verified-badge" role="img" aria-label="Verified creator" title="Verified creator" hidden></span>
      </div>
    </section>
    <section class="loading-error-panel" role="alertdialog" aria-modal="true"
             aria-labelledby="loading-error-title" aria-describedby="loading-error-message loading-error-code" hidden>
      <header class="loading-error-header"><h1 id="loading-error-title">Join Error</h1></header>
      <div class="loading-error-divider" aria-hidden="true"></div>
      <div class="loading-error-body">
        <div class="loading-error-copy"><p id="loading-error-message"></p><p id="loading-error-code"></p></div>
        <button id="loading-error-leave" type="button">Leave</button>
      </div>
    </section>
    <div id="status" role="status" aria-live="polite">Preparing Roblox…</div>
    <div class="loading-status-spinner" aria-hidden="true"></div>
    <button id="loading-cancel" type="button" aria-label="Cancel loading" title="Cancel"></button>
    <img id="rlogo" src="/rubiks-head.svg" alt="">
  </div>
</div>

<div class="emscripten" hidden><span id="server"></span><span id="proxyenabled"></span></div>

<pre id="dbg"></pre>

<script>
(function(){
  var q=new URLSearchParams(location.search).get("gq");
  if(q==="good"||q==="lite"||q==="low")localStorage.setItem("rh.graphics",q);
})();
</script>

<script src="/webclient/i18n.js"></script>
<script src="/webclient/consolelog.js"></script>
<script src="/webclient/_ids.js"></script>
<script src="/webclient/api-url.js"></script>
<script>
// ── host config + dev settings ──────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const placeId = +(params.get('placeId') || params.get('gid') || params.get('id') || window.__placeId || 0) || null;
if (params.has('debug')) document.getElementById('dbg').style.display = 'block';

// leave target — cnfg.json leavePage, tokens <gid> (place id) + <gname> (exp name)
window.__rhLeavePage = '';
fetch('/rh-config').then(r => r.json()).then(c => { window.__rhLeavePage = c.leavePage || ''; }).catch(() => {});
window.__leaveTarget = function () {
  const t = window.__rhLeavePage;
  if (!t) return 'about:blank';
  return t.replace(/<gid>/g, placeId || '')
          .replace(/<gname>/g, encodeURIComponent(window.__expName || ''));
};

// ── RubiksHead boot banner owns the top of the console ───────────────────────
// LOG.hold() buffers EVERYTHING until the banner lands; release() replays it.
LOG.hold();
(async () => {
  const t0 = performance.now();
  LOG.brand(T('auth.loggingIn'));
  let user = null;
  try {
    const r = await fetch(apiUrl('users', '/v1/users/authenticated'), { credentials: 'include' });
    if (r.ok) user = await r.json();
  } catch {}
  if (user && user.name) {
    LOG.brand(T('auth.done', Math.round(performance.now() - t0)));
    LOG.brand(T('auth.welcome', user.displayName || user.name));
    LOG.brand(T('auth.repo'));
    let expName = `experience ${placeId || ''}`.trim();
    if (placeId) try {
      const r = await fetch(apiUrl('economy', `/v2/assets/${placeId}/details`), { credentials: 'include' });
      if (r.ok) { const d = await r.json(); if (d.Name) { expName = d.Name; window.__expName = d.Name; } }
    } catch {}
    LOG.brand(T('auth.standby', expName));
  } else {
    LOG.brand(T('auth.none'));
    const ov = document.getElementById('loading-overlay');
    const panel = ov.querySelector('.loading-error-panel');
    document.getElementById('loading-error-message').textContent = T('auth.none');
    document.getElementById('loading-error-code').textContent = '';
    ov.classList.add('loading-failed');
    panel.hidden = false;
    document.getElementById('loading-error-leave').onclick = () => location.reload();
  }
  LOG.release();
})();

// presence cookie so engine-side document.cookie checks pass; the real
// .ROBLOSECURITY is injected server-side and never reaches the page.
document.cookie = ".ROBLOSECURITY=placeholder; path=/; SameSite=Lax";

// neuter login redirects (engine tries to bounce signed-out clients)
(function(){
  const isLogin = u => /\/login|Logout|NewLogin/.test(String(u||''));
  for (const k of ['assign','replace']) { const o = Location.prototype[k];
    Location.prototype[k] = function(u){ if(isLogin(u)) return DBG?.auth('blocked login redirect',u); return o.call(this,u); }; }
})();

// engine bootstrap config — local binary, prod channel resolution off
window.robloxWasmHostConfig = {
  server: 'prod',
  useCdnBinary: false,
  workerStubUrl: location.origin + '/webclient/stub.js',
};
window.__wasmDevSettings = {
  // host the engine derives <svc>.* api hosts from — first label is all
  // apiUrl needs, so www.<our host> is a perfectly good base
  baseUrl: 'www.' + location.host,
  authCookie: '',
  isCookieFromPool: () => false,
  allocateCookieFromPool: async () => null,
  setAuthCookie: () => {},
  getFlagOverrides: () => ({
    FFlagEnableExternalWebSockets: 'True', FFlagDebugUTPController: 'True', DebugUTPController: 'True',
    FStringDebugUTPLauncherWebSocketUri: location.origin.replace(/^http/, 'ws') + '/udp-relay',
    // serve.py-proven path: UTP/RakNet datagrams -> ws -> raw UDP -> replies.
    // (RbxTransport-WT datagrams got silence — the qdmux edge wants RUPP-UDP.)
    FFlagDebugRbxTransportClientUseWt: 'False', DebugRbxTransportClientUseWt: 'False',
    FFlagDebugRbxTransportGenerateGameFqdn: 'False', DebugRbxTransportGenerateGameFqdn: 'False',
    FFlagRbxTransportConnectionFailureFallbackToRakNet: 'False',
    DFIntDebugFRMQualityLevelOverride: '1',   // floor render quality — biggest client-side fps lever
    // streaming = REQUEST envelope, not residency: a wide target radius +
    // lifted quota tells the RCC to send the whole map (zoom-out fills
    // instead of stalling), while the adaptive controller, texture/mip
    // budgets and TunableMemoryTracking keep shedding RESIDENCY under
    // pressure. Request everything, keep only what fits.
    FFlagAdaptiveRadiusEnabled: 'True', DFFlagAdaptiveRadiusEnabled: 'True',
    DFIntStreamingTargetRadiusStuds: '1000000', FIntStreamingTargetRadiusStuds: '1000000',
    DFIntStreamingMinRadiusStuds: '4096', FIntStreamingMinRadiusStuds: '4096',
    DFIntStreamingAdaptiveRadiusOverrideTarget: '1000000',
    DFIntStreamingMaxQuotaCap: '2000000000',
    DFIntStreamingPauseMode: '0',
    // frustum streaming: client ships its camera frustum to the RCC, which
    // streams regions INSIDE the view cone even beyond the radius — this is
    // the zoom-out path ("camera far from avatar" is exactly the trigger
    // Enum.FrustumStreamingMode.Automatic watches for; Enabled=always).
    // Far plane uncapped so a fully zoomed-out camera still requests;
    // GC grace keeps fetched regions alive through pans (hysteresis).
    FFlagFrustumStreaming: 'True', DFFlagFrustumStreaming: 'True',
    FFlagEnableFrustumAutomation: 'True', DFFlagEnableFrustumAutomation: 'True',
    FIntFrustumStreamingMode: '1', DFIntFrustumStreamingMode: '1',
    FFlagSendCameraFrustum: 'True', DFFlagSendCameraFrustum: 'True',
    FIntCameraFrustumReplicationFrequencyHz: '30', DFIntCameraFrustumReplicationFrequencyHz: '30',
    FIntFrustumStreamingMaxFarPlaneStuds: '1000000', DFIntFrustumStreamingMaxFarPlaneStuds: '1000000',
    FIntStreamingFrustumGCGracePeriodMs: '12000', DFIntStreamingFrustumGCGracePeriodMs: '12000',
    // ?englog=1: engine-side diagnostics — restore wasm console imports (glue)
    // AND open the replication DFLog channels so the log names the wire item
    // that kills the stream ("Error while streaming data", code 261)
    ...(new URLSearchParams(location.search).has('englog') ? {
      DFLogNetworkReadItem: '15', DFLogNetworkPacketsReceive: '15',
      DFLogJoinDataRxStats: '15', DFLogNetworkJDIImpact: '15',
      DFLogNetworkJoin: '15', DFLogNetworkAudit: '15',
      DFLogReplicationDataCaching: '15', DFLogNetworkClient: '15',
      DFLogNetworkOwnershipErrors: '15', DFLogNetworkStreaming: '15',
      DFLogISRIncomingOutgoingAttributes: '15',
      DFLogLargeReplicatorTrace: '15', DFLogReplicationDataLifetime: '15',
      // frustum + GC-job decisions — "Client frustum progress … near {} far
      // {} max region radius {}" proves the zoom-out request is being made;
      // StreamMRF shows the server-side focus request; NetworkPauseLogging
      // shows the GC job falling back to min radius / focus tracking.
      DFLogNetworkStreamingExpandedShapeQuery: '15', DFLogStreamMRF: '15',
      DFLogNetworkPauseLogging: '15',
    } : {}),
  }),
};

if (placeId && !/placeId=/.test(location.search))
  history.replaceState({}, '', location.pathname + '?placeId=' + placeId);
</script>
<script src="/webclient/WasmLoader.js"></script>
<script src="/webclient/driver.js" type="module"></script>
</body></html>
